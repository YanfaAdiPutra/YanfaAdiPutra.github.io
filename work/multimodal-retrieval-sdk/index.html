    <script>
      // The page content is AES-256-GCM ciphertext. The key is derived from the
      // password with PBKDF2, in the browser. Without the password this file holds
      // nothing readable, which is the difference between this and a JavaScript
      // password check that anyone defeats with view-source.
      (function () {
        var payload = JSON.parse(
          document.getElementById("payload").textContent,
        );
        var form = document.getElementById("unlock-form");
        var input = document.getElementById("password");
        var error = document.getElementById("error");
        var STORE_KEY = "site-pw";

        function hexToBytes(hex) {
          var out = new Uint8Array(hex.length / 2);
          for (var i = 0; i < out.length; i++) {
            out[i] = parseInt(hex.substr(i * 2, 2), 16);
          }
          return out;
        }

        function base64ToBytes(b64) {
          var binary = atob(b64);
          var out = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
          return out;
        }

        async function decrypt(password) {
          var encoder = new TextEncoder();
          var base = await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"],
          );
          var key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: hexToBytes(payload.salt),
              iterations: payload.iterations,
              hash: "SHA-256",
            },
            base,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"],
          );
          var plain = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: hexToBytes(payload.iv) },
            key,
            base64ToBytes(payload.data),
          );
          return new TextDecoder().decode(plain);
        }

        function render(html) {
          document.open();
          document.write(html);
          document.close();
        }

        async function attempt(password, fromStore) {
          try {
            var html = await decrypt(password);
            try {
              sessionStorage.setItem(STORE_KEY, password);
            } catch (e) {}
            render(html);
            return true;
          } catch (e) {
            if (fromStore) {
              try {
                sessionStorage.removeItem(STORE_KEY);
              } catch (e2) {}
            } else {
              error.hidden = false;
              input.value = "";
              input.focus();
            }
            return false;
          }
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          error.hidden = true;
          attempt(input.value, false);
        });

        // Unlock once per tab rather than once per page, so following a link does
        // not ask again.
        var stored = null;
        try {
          stored = sessionStorage.getItem(STORE_KEY);
        } catch (e) {}
        if (stored) attempt(stored, true);
      })();
